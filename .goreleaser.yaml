version: 2

project_name: wrikery

builds:
  - main: ./cmd/wrikery
    binary: wrikery
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Tag}} -X main.commit={{.ShortCommit}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # files replaces goreleaser's default list, so the two the archive always carried are named again.
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: man/wrikery.1
        info:
          mtime: "{{ .CommitDate }}"
    # The commit date on every file, so the archive does not change with the time of the build.
    builds_info:
      mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# Only the checksum file is signed, the archives are covered by their hashes in it.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum

release:
  footer: |
    How to check these files: https://github.com/mrcne/wrikery/blob/{{ .Tag }}/SECURITY.md#checking-a-release

homebrew_casks:
  - repository:
      owner: mrcne
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/mrcne/wrikery
    description: Unofficial terminal client for Wrike
    manpages: [man/wrikery.1]
    skip_upload: auto
    hooks:
      post:
        # The binary is not notarized, so Gatekeeper refuses its first run while the quarantine attribute is set.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}"]
          end
    zap:
      trash:
        - ~/.config/wrikery
        - ~/.local/share/wrikery
        - ~/.local/state/wrikery

changelog:
  use: github
  groups:
    - title: Features
      regexp: "^feat"
      order: 0
    - title: Fixes
      regexp: "^fix"
      order: 1
    - title: Build
      regexp: "^build"
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs"
      - "^chore"
      - "^test"
      - "^refactor"
