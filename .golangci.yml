version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - misspell
  settings:
    depguard:
      rules:
        wrike-client-stdlib-only:
          list-mode: strict
          files:
            - "**/pkg/wrike/**"
          allow:
            - $gostd
            - github.com/mrcne/wrikery/pkg/wrike

formatters:
  enable:
    - gofmt
    - goimports
